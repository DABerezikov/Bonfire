name: Bonfire — MONOBLOCK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonfire-monoblock
  cancel-in-progress: false

jobs:
  build:
    name: Проверки и публикация
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Полный тест-гейт
        run: dotnet test Bonfire.sln -c Release --nologo --logger trx --results-directory artifacts/tests
      - name: Проверки развёртывания
        run: |
          & ./Tests/Deployment/LocalPublish.Tests.ps1
          & ./Tests/Deployment/LocalPublish.Git.Tests.ps1
          & ./Tests/Deployment/ArtifactDownload.Tests.ps1
          & ./Tests/Deployment/Deploy.Tests.ps1
          & ./Tests/Deployment/Runner.Tests.ps1
          & ./Tests/Deployment/InteractiveUpdate.Tests.ps1
          & ./Tests/Deployment/ClosedUpdate.Integration.Tests.ps1
          & ./Tests/Deployment/WorkflowEncoding.Tests.ps1
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -ExecutionPolicy Bypass -File ./Tests/Deployment/Confirmation.Wpf.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Проверка запуска и завершения
        run: dotnet run --project Tests/Startup.Smoke/Startup.Smoke.csproj -c Release
      - name: Публикация Windows x64
        run: dotnet publish Bonfire/Bonfire.csproj -p:PublishProfile=FolderProfile -o artifacts/publish --nologo
      - name: Проверка единого исполняемого файла
        run: ./Tests/Deployment/SingleFile.Tests.ps1 -PublishDirectory artifacts/publish
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node.js 24)
        with:
          name: bonfire-win-x64
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node.js 24)
        if: always()
        with:
          name: test-results
          path: artifacts/tests/*.trx
          if-no-files-found: warn
